<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B2F6B"/>
      <stop offset="0.55" stop-color="#1F3A68"/>
      <stop offset="1" stop-color="#0F2236"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="22" fill="url(#wall)"/>
  <!-- menu bar -->
  <rect width="1200" height="34" rx="0" fill="#000" fill-opacity="0.28"/>
  <text x="26" y="23" fill="#fff" font-size="15" font-weight="700">Finder</text>
  <text x="112" y="23" fill="#fff" fill-opacity="0.85" font-size="14">Ficheiro   Editar   Ver   Ir   Janela</text>
  <g transform="translate(1046 9)">
    <rect x="0" y="0" width="7" height="16" rx="1.5" fill="#fff"/>
    <rect x="9" y="0" width="7" height="7" rx="1.5" fill="#fff"/>
    <rect x="9" y="9" width="7" height="7" rx="1.5" fill="#fff"/>
  </g>
  <text x="1080" y="23" fill="#fff" fill-opacity="0.85" font-size="14">ter 12:30</text>
  <!-- zones -->
  <g>
    <rect x="16" y="50" width="572" height="634" rx="14" fill="#3D8BFF" fill-opacity="0.45" stroke="#5EA8FF" stroke-width="4"/>
    <text x="302" y="600" text-anchor="middle" fill="#fff" font-size="88" font-weight="800">1</text>
    <rect x="604" y="50" width="580" height="309" rx="14" fill="#3D8BFF" fill-opacity="0.14" stroke="#5EA8FF" stroke-opacity="0.7" stroke-width="2"/>
    <text x="894" y="222" text-anchor="middle" fill="#fff" fill-opacity="0.8" font-size="60" font-weight="800">2</text>
    <rect x="604" y="375" width="580" height="309" rx="14" fill="#3D8BFF" fill-opacity="0.14" stroke="#5EA8FF" stroke-opacity="0.7" stroke-width="2"/>
    <text x="894" y="547" text-anchor="middle" fill="#fff" fill-opacity="0.8" font-size="60" font-weight="800">3</text>
  </g>
  <!-- dragged window -->
  <g filter="url(#shadow)" transform="translate(150 150) rotate(-2)">
    <rect width="470" height="320" rx="14" fill="#F5F6F8"/>
    <rect width="470" height="40" rx="14" fill="#E4E6EA"/>
    <rect y="26" width="470" height="14" fill="#E4E6EA"/>
    <circle cx="24" cy="20" r="7" fill="#FF5F57"/>
    <circle cx="46" cy="20" r="7" fill="#FEBC2E"/>
    <circle cx="68" cy="20" r="7" fill="#28C840"/>
    <text x="235" y="26" text-anchor="middle" fill="#555" font-size="14" font-weight="600">Notas</text>
    <rect x="28" y="70" width="300" height="14" rx="7" fill="#C9CDD4"/>
    <rect x="28" y="100" width="400" height="12" rx="6" fill="#DDE0E5"/>
    <rect x="28" y="124" width="360" height="12" rx="6" fill="#DDE0E5"/>
    <rect x="28" y="148" width="390" height="12" rx="6" fill="#DDE0E5"/>
    <rect x="28" y="188" width="220" height="14" rx="7" fill="#C9CDD4"/>
    <rect x="28" y="218" width="380" height="12" rx="6" fill="#DDE0E5"/>
    <rect x="28" y="242" width="320" height="12" rx="6" fill="#DDE0E5"/>
  </g>
  <!-- cursor -->
  <g transform="translate(372 162)">
    <path d="M0 0 L0 30 L8 23 L13 35 L18 33 L13 21 L23 21 Z" fill="#000" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- shift key hint -->
  <g transform="translate(40 620)">
    <rect width="150" height="50" rx="12" fill="#fff" fill-opacity="0.92"/>
    <text x="75" y="33" text-anchor="middle" fill="#222" font-size="20" font-weight="700">⇧ Shift</text>
  </g>
</svg>
