name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Bundle
        run: ./scripts/build-app.sh
